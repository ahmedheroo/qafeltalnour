name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # "environment: github-pages" makes the job use the github-pages
    # environment's secrets. You can create the secret either:
    #   a) Settings → Environments → github-pages → Add environment secret → COHERE_API_KEY, or
    #   b) Settings → Secrets and variables → Actions → Repository secret → COHERE_API_KEY
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Generate api/config.js from COHERE_API_KEY secret
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          mkdir -p api
          if [ -z "$COHERE_API_KEY" ]; then
            echo "COHERE_API_KEY secret is not set — deploying in demo mode (no live Cohere answers)."
            cat > api/config.js <<'EOF'
window.QN_CHAT_CONFIG = { cohereApiKey: '' };
EOF
          else
            echo "Generating api/config.js with the COHERE_API_KEY secret."
            {
              echo 'window.QN_CHAT_CONFIG = {'
              printf '    cohereApiKey: %s\n' "$(printf '%s' "$COHERE_API_KEY" | jq -Rs .)"
              echo '};'
            } > api/config.js
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
